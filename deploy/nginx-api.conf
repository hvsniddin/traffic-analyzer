# /etc/nginx/sites-available/api.targz.dev
# Enable: sudo ln -s /etc/nginx/sites-available/api.targz.dev /etc/nginx/sites-enabled/
# TLS:    sudo certbot --nginx -d api.targz.dev   (adds the 443 block)
server {
	listen 80;
	listen [::]:80;
	server_name api.targz.dev;

	# Slightly above WIUT_MAX_UPLOAD_MB so the API returns the readable 413.
	client_max_body_size 2100m;
	# Stream uploads to the API instead of buffering them in nginx first.
	proxy_request_buffering off;
	proxy_read_timeout 600s;
	proxy_send_timeout 600s;

	location / {
		proxy_pass http://127.0.0.1:8000;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
